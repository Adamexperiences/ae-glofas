name: Harvest baseline artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID to pull bl-* artifacts from"
        default: "38747546366"
      outfile:
        description: "Output JSON path"
        default: "data/baseline.json"
permissions:
  contents: write
  actions: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: bl-*
      - name: Merge
        env:
          OUTFILE: ${{ inputs.outfile }}
        run: |
          cat > merge.py <<'PYEOF'
          import json, glob, os, datetime
          OUT = os.environ.get("OUTFILE", "data/baseline.json")
          out = {"built": datetime.datetime.utcnow().isoformat()+"Z", "gauges": {}}
          if os.path.exists(OUT):
              try:
                  prev = json.load(open(OUT))
                  out["gauges"].update(prev.get("gauges", {}))
                  print("loaded existing gauges from", OUT, ":", list(out["gauges"].keys()), flush=True)
              except Exception as e:
                  print("existing", OUT, "unreadable, fresh:", e, flush=True)
          for f in sorted(glob.glob("artifacts/**/*.json", recursive=True)):
              try:
                  out["gauges"].update(json.load(open(f)))
              except Exception as e:
                  print("skip", f, e, flush=True)
          os.makedirs(os.path.dirname(OUT) or ".", exist_ok=True)
          json.dump(out, open(OUT, "w"))
          print("wrote", OUT, "gauges:", list(out["gauges"].keys()), "size", os.path.getsize(OUT), flush=True)
          PYEOF
          python3 merge.py
      - name: Commit
        env:
          OUTFILE: ${{ inputs.outfile }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTFILE"
          git commit -m "harvest: run ${{ inputs.run_id }} artifacts -> $OUTFILE" || echo "no change"
          git pull --rebase --autostash || true
          git push
