name: GloFAS baseline builder
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years (range like 2015-2024)"
        default: "2015-2024"
      pctl:
        description: "Low-flow percentile threshold"
        default: "10"
      gauges:
        description: "JSON array of gauges to pull"
        default: '["kaub","maxau","koln","basel","lobith","pfelling","kienstock","wildungsmauer","budapest","mohacs","giurgiu"]'
      outfile:
        description: "Output JSON path"
        default: "data/baseline.json"
permissions:
  contents: write
jobs:
  pull:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        gauge: ${{ fromJSON(inputs.gauges) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install "cdsapi>=0.7.7" xarray "netcdf4" cfgrib eccodes numpy
      - name: CDS config
        env:
          CDS_KEY: ${{ secrets.CDS_KEY }}
        run: |
          printf 'url: https://ewds.climate.copernicus.eu/api\nkey: %s\n' "$CDS_KEY" > "$HOME/.cdsapirc"
      - name: Pull gauge
        env:
          GAUGE: ${{ matrix.gauge }}
          YEARS: ${{ inputs.years }}
          PCTL: ${{ inputs.pctl }}
        run: |
          cat > baseline_one.py <<'PYEOF'
          import cdsapi, os, json, zipfile, traceback
          import numpy as np
          
          GAUGES = {
              "kaub":{"river":"rhine","lat":50.085,"lon":7.765},
              "maxau":{"river":"rhine","lat":49.039,"lon":8.306},
              "koln":{"river":"rhine","lat":50.937,"lon":6.963},
              "basel":{"river":"rhine","lat":47.559,"lon":7.590},
              "lobith":{"river":"rhine","lat":51.840,"lon":6.110},
              "pfelling":{"river":"danube","lat":48.880,"lon":12.750},
              "kienstock":{"river":"danube","lat":48.380,"lon":15.460},
              "wildungsmauer":{"river":"danube","lat":48.120,"lon":16.920},
              "budapest":{"river":"danube","lat":47.498,"lon":19.045},
              "mohacs":{"river":"danube","lat":45.990,"lon":18.680},
              "giurgiu":{"river":"danube","lat":43.900,"lon":25.970},
          }
          GAUGE = os.environ["GAUGE"]
          g = GAUGES[GAUGE]
          PCTL = float(os.environ.get("PCTL", "10"))
          
          def parse_years(s):
              s = s.strip()
              if "-" in s:
                  a, b = s.split("-"); return list(range(int(a), int(b) + 1))
              return [int(x) for x in s.split(",") if x.strip()]
          YEARS = parse_years(os.environ.get("YEARS", "2015-2024"))
          
          c = cdsapi.Client()
          MONTHS = [f"{m:02d}" for m in range(1, 13)]
          DAYS = [f"{d:02d}" for d in range(1, 32)]
          
          def pull_all(area, years):
              # ONE request for ALL years at once
              for fmt, ext in (("netcdf4", "nc"), ("grib2", "grib")):
                  try:
                      req = {
                          "system_version":["version_4_0"], "hydrological_model":["lisflood"],
                          "product_type":["consolidated"], "timespan":["time_mean"],
                          "variable":["average_river_discharge_in_the_last_24_hours"],
                          "year":[str(y) for y in years], "month":MONTHS, "day":DAYS,
                          "data_format":fmt, "download_format":"unarchived", "area":area,
                      }
                      tgt = f"h_all.{ext}"
                      c.retrieve("cems-glofas-historical", req, tgt)
                      if zipfile.is_zipfile(tgt):
                          with zipfile.ZipFile(tgt) as z:
                              z.extractall("xall")
                              cand = [os.path.join("xall", n) for n in z.namelist() if n.endswith((".nc",".grib",".grib2"))]
                              tgt = cand[0] if cand else tgt
                      import xarray as xr
                      eng = "netcdf4" if tgt.endswith(".nc") else "cfgrib"
                      ds = xr.open_dataset(tgt, engine=eng)
                      var = "dis24" if "dis24" in ds.data_vars else list(ds.data_vars)[0]
                      da = ds[var].squeeze()
                      latn = [d for d in da.dims if "lat" in d.lower()][0]
                      lonn = [d for d in da.dims if "lon" in d.lower()][0]
                      timen = [d for d in da.dims if d not in (latn, lonn)][0]
                      tvals = ds[timen].values if timen in ds.coords else da[timen].values
                      dates = [str(np.datetime64(t, "D")) for t in np.atleast_1d(tvals)]
                      cube = da.transpose(timen, latn, lonn).values
                      return dates, cube, da[latn].values, da[lonn].values
                  except Exception as e:
                      print(f"[{fmt}] failed: {repr(e)[:200]}", flush=True)
              raise RuntimeError("all formats failed")
          
          # small box (~3x3 cells) to keep 10yr request well under the CDS field cap
          area = [round(g["lat"]+0.075,3), round(g["lon"]-0.075,3), round(g["lat"]-0.075,3), round(g["lon"]+0.075,3)]
          dates, cube, lats, lons = pull_all(area, YEARS)
          d = np.array(dates); full = cube.astype(float)
          meanmap = np.nanmean(full, axis=0)
          ij = np.unravel_index(np.nanargmax(meanmap), meanmap.shape)
          s = full[:, ij[0], ij[1]]
          thr = float(np.nanpercentile(s, PCTL))
          months = np.array([int(x[5:7]) for x in d])
          clim = [{"m":m, "as_planned": (round(float(np.mean(s[months==m] >= thr)),3) if (months==m).any() else None)} for m in range(1,13)]
          rec = {"river":g["river"], "lat":g["lat"], "lon":g["lon"],
                 "cell":[round(float(lats[ij[0]]),3), round(float(lons[ij[1]]),3)],
                 "unit":"m3/s", "threshold":round(thr,1), "mean_flow":round(float(np.nanmean(s)),1),
                 "n_days":int(s.size), "years":[min(YEARS),max(YEARS)], "monthly_climatology":clim,
                 "series":{"dates":list(d), "flow":[int(round(v)) for v in s]}}
          json.dump({GAUGE:rec}, open(f"{GAUGE}.json", "w"))
          print(f"{GAUGE}: cell {rec['cell']} thr(p{PCTL:g})={thr:.0f} mean={rec['mean_flow']:.0f} days={s.size}", flush=True)
          PYEOF
          python baseline_one.py
      - uses: actions/upload-artifact@v4
        with:
          name: bl-${{ matrix.gauge }}
          path: ${{ matrix.gauge }}.json
          retention-days: 7
          if-no-files-found: ignore
  merge:
    needs: pull
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge
        env:
          OUTFILE: ${{ inputs.outfile }}
        run: |
          cat > merge.py <<'PYEOF'
          import json, glob, os, datetime
          OUT = os.environ.get("OUTFILE", "data/baseline.json")
          out = {"built": datetime.datetime.utcnow().isoformat()+"Z", "gauges": {}}
          if os.path.exists(OUT):
              try:
                  prev = json.load(open(OUT))
                  out["gauges"].update(prev.get("gauges", {}))
                  print("loaded existing gauges from", OUT, ":", list(out["gauges"].keys()), flush=True)
              except Exception as e:
                  print("existing", OUT, "unreadable, fresh:", e, flush=True)
          for f in sorted(glob.glob("artifacts/**/*.json", recursive=True)):
              try:
                  out["gauges"].update(json.load(open(f)))
              except Exception as e:
                  print("skip", f, e, flush=True)
          os.makedirs(os.path.dirname(OUT) or ".", exist_ok=True)
          json.dump(out, open(OUT, "w"))
          print("wrote", OUT, "gauges:", list(out["gauges"].keys()), "size", os.path.getsize(OUT), flush=True)
          PYEOF
          python merge.py
      - name: Commit
        env:
          OUTFILE: ${{ inputs.outfile }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTFILE"
          git commit -m "baseline fast: ${{ inputs.gauges }} -> $OUTFILE" || echo "no change"
          git pull --rebase --autostash || true
          git push
